name: documentation-validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Public-safety scan
        run: python3 scripts/check_public_safety.py
      - name: Markdown links
        run: python3 scripts/check_markdown_links.py
