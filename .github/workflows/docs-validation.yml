name: repository-validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Python compile check
        run: python3 -m py_compile automation/*.py scripts/*.py
      - name: Alert integration unit tests
        run: PYTHONWARNINGS=error::ResourceWarning python3 -m unittest discover -v
      - name: Public-safety scan
        run: python3 scripts/check_public_safety.py
      - name: Markdown links
        run: python3 scripts/check_markdown_links.py
